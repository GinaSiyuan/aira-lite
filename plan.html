<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aira · 计划</title><style>

    :root {
      color-scheme: light;
      --page: #ededec;
      --card: #ffffff;
      --ink: #101011;
      --ink-2: #6b6b6e;
      --ink-3: #69696d;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --component-gap: 12px;
      --hair: #e6e6e5;
      --hair-2: #f3f3f1;
      --dark: #0b0b0c;
      --plan-card-gradient:
        radial-gradient(120% 140% at -4% 110%, rgba(168,191,74,.74), rgba(168,191,74,.06) 60%, transparent 72%),
        radial-gradient(100% 120% at 104% 0%, rgba(94,137,168,.54), rgba(58,58,51,.12) 62%, transparent 75%),
        linear-gradient(145deg, #222422, #111214 72%);
      --lime: #dcf55a;
      --coral: #ff8a5b;
      --sky: #7acbff;
      --violet: #b79bff;
      --amber: #ffb85c;
      --mint: #92e0b4;
      --shell-radius: 30px;
      --card-radius: 22px;
      --small-radius: 14px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html, body { margin: 0; min-height: 100%; }
    html { scroll-padding-block: 16px 120px; }

    body {
      background: var(--page);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    button { font: inherit; }
    button, .rec-card { overflow-wrap: anywhere; }

    .app-shell {
      position: relative;
      width: 100%;
      min-height: 100dvh;
      overflow-x: hidden;
      background: var(--page);
    }

    .page {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 20px calc(104px + var(--safe-bottom));
      scroll-padding-block: 16px 120px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 0 var(--component-gap);
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--ink-3);
      font-size: 12px;
      line-height: 1.5;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.18;
      letter-spacing: -.7px;
      font-weight: 650;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(145deg, #8ba9b9, #6e796b 58%, #2e332e);
      box-shadow: 0 5px 14px rgba(16,16,17,.14);
      font-size: 13px;
      font-weight: 700;
    }

    .section { margin-top: var(--component-gap); }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 var(--component-gap);
    }

    .section-label {
      margin: 0;
      color: var(--ink-3);
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: 0;
      text-transform: uppercase;
      font-weight: 720;
    }

    .section-meta {
      color: var(--ink-3);
      font-size: 12px;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
    }

    .surface {
      border: 1px solid var(--hair);
      border-radius: var(--card-radius);
      background: var(--card);
    }

    .fog-card {
      position: relative;
      overflow: hidden;
      border-radius: var(--card-radius);
      color: #fff;
      background: var(--plan-card-gradient);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035), inset 0 -16px 36px rgba(0,0,0,.18);
    }

    .goal-card {
      width: 100%;
      padding: var(--space-lg);
      border: 0;
      text-align: left;
      cursor: pointer;
    }

    .goal-head,
    .goal-foot,
    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .direction-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      width: fit-content;
      border-radius: 999px;
      font-weight: 680;
    }

    .goal-period-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      width: fit-content;
      margin-left: auto;
      flex-shrink: 0;
      white-space: nowrap;
      padding: 4px 8px;
      border-radius: 999px;
      color: #e4e6e5;
      background: rgba(255,255,255,.09);
      font-size: 12px;
      line-height: 1.5;
      font-weight: 680;
    }

    .goal-period-chip::before {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--lime);
      content: "";
    }

    .goal-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
      letter-spacing: 0;
      font-weight: 680;
    }

    .goal-summary {
      margin: var(--space-sm) 0 0;
      max-width: 560px;
      color: #d4d8d2;
      font-size: 13px;
      line-height: 1.6;
    }

    .goal-foot {
      justify-content: flex-end;
      gap: 4px;
      text-align: right;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.1);
      color: var(--lime);
      font-size: 13px;
      line-height: 1.5;
      font-weight: 650;
    }

    .detail-page { padding-top: 0; }

    .detail-header {
      position: sticky;
      z-index: 30;
      top: 0;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      align-items: center;
      min-height: 72px;
      padding: 16px 0 12px;
      background: linear-gradient(var(--page) 78%, rgba(237,237,236,0));
    }

    .detail-header h1 {
      overflow: hidden;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 17px;
      letter-spacing: -.2px;
    }

    .back-button {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.76);
      border-radius: 50%;
      color: var(--ink);
      background: rgba(255,255,255,.72);
      cursor: pointer;
    }

    .back-button .icon { width: 19px; height: 19px; }

    .detail-hero {
      padding: 20px 16px;
    }

    .detail-hero > .detail-hero-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      color: var(--lime);
      font-size: 12px;
      line-height: 1.5;
      font-weight: 700;
    }

    .detail-hero-label::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--lime);
      content: "";
    }

    .detail-hero h2 {
      margin: 0;
      font-size: 25px;
      line-height: 1.24;
      letter-spacing: -.5px;
      font-weight: 680;
    }

    .detail-hero > p:not(.detail-hero-label) {
      margin: 12px 0 0;
      color: #d4d8d2;
      font-size: 13px;
      line-height: 1.65;
    }

    .detail-section { margin-top: var(--component-gap); }

    .detail-section-head {
      margin-bottom: var(--component-gap);
    }

    .detail-section-head h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
      letter-spacing: -.15px;
      font-weight: 700;
    }

    .detail-section-head p {
      margin: 4px 0 0;
      color: var(--ink-3);
      font-size: 13px;
      line-height: 1.55;
    }

    .cycle-overview-card {
      padding: var(--space-lg);
    }

    .cycle-overview-label {
      display: block;
      color: var(--ink-3);
      font-size: 12px;
      line-height: 1.5;
      font-weight: 700;
    }

    .cycle-overview-card h2 {
      margin: 4px 0 0;
      font-size: 22px;
      line-height: 1.3;
      letter-spacing: -.35px;
      font-weight: 700;
    }

    .cycle-progress {
      position: relative;
      height: 58px;
      margin-top: var(--space-lg);
    }

    .cycle-progress-track {
      position: absolute;
      top: 7px;
      right: 7px;
      left: 7px;
      height: 2px;
      border-radius: 999px;
      background: var(--hair);
    }

    .cycle-progress-fill {
      display: block;
      width: 52%;
      height: 100%;
      border-radius: inherit;
      background: var(--ink);
    }

    .cycle-progress-node {
      position: absolute;
      top: 0;
      width: 16px;
      height: 16px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--card);
      transform: translateX(-50%);
    }

    .cycle-progress-node.start { left: 7px; transform: none; background: var(--ink); }
    .cycle-progress-node.today { left: 52%; background: var(--ink); }
    .cycle-progress-node.review { right: 7px; left: auto; transform: none; }

    .cycle-progress-label {
      position: absolute;
      top: 28px;
      color: var(--ink-3);
      font-size: 12px;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .cycle-progress-label.start { left: 0; }
    .cycle-progress-label.today { left: 52%; color: var(--ink); font-weight: 700; transform: translateX(-50%); }
    .cycle-progress-label.review { right: 0; }

    .cycle-direction-list {
      display: grid;
      gap: var(--component-gap);
    }

    .cycle-direction-card {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      align-items: start;
      gap: var(--space-md);
      padding: var(--space-lg);
    }

    .cycle-direction-icon {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      color: var(--ink);
    }

    .cycle-direction-icon.night { background: rgba(183,155,255,.28); }
    .cycle-direction-icon.rhythm { background: rgba(220,245,90,.48); }
    .cycle-direction-icon.load { background: rgba(122,203,255,.28); }
    .cycle-direction-icon .icon { width: 20px; height: 20px; }
    .cycle-direction-copy { min-width: 0; }

    .cycle-direction-card h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.4;
      font-weight: 700;
    }

    .cycle-direction-copy > p {
      margin: var(--space-sm) 0 0;
      color: var(--ink-2);
      font-size: 13px;
      line-height: 1.6;
    }

    .cycle-condition {
      margin-top: var(--space-md);
      padding-top: var(--space-md);
      border-top: 1px solid var(--hair);
      color: var(--ink-3);
      font-size: 12px;
      line-height: 1.55;
    }

    .cycle-dynamic-note {
      margin-top: var(--component-gap);
      padding: var(--space-lg);
      border-radius: 18px;
      background: rgba(220,245,90,.38);
      color: var(--ink-2);
      font-size: 13px;
      line-height: 1.6;
    }

    .judgment-card,
    .evidence-card,
    .criteria-card,
    .agent-card {
      padding: var(--space-lg);
    }

    .judgment-label {
      display: block;
      margin-bottom: 8px;
      color: var(--ink-3);
      font-size: 12px;
      line-height: 1.5;
      font-weight: 700;
    }

    .judgment-card p {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      font-weight: 620;
    }

    .evidence-list {
      display: grid;
      gap: var(--component-gap);
      margin-top: var(--component-gap);
    }

    .evidence-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .evidence-index {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      flex: none;
      border-radius: 9px;
      color: var(--ink);
      background: rgba(220,245,90,.58);
      font-size: 12px;
      font-weight: 760;
    }

    .source-chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      color: var(--ink-2);
      background: var(--hair-2);
      font-size: 11px;
      line-height: 1.5;
      white-space: nowrap;
      font-weight: 650;
    }

    .evidence-title {
      margin: 12px 0 0;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 700;
    }

    .evidence-copy {
      margin: 4px 0 0;
      color: var(--ink-3);
      font-size: 13px;
      line-height: 1.58;
    }

    .trend-chart {
      margin-top: 12px;
      padding: 12px 12px 8px;
      border-radius: 16px;
      background: var(--hair-2);
    }

    .trend-chart svg {
      display: block;
      width: 100%;
      height: 94px;
      overflow: visible;
    }

    .chart-grid { stroke: #dededb; stroke-width: 1; }
    .chart-line { fill: none; stroke: #6c7b25; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .chart-area { fill: url(#trend-fill); }
    .chart-dot { fill: #fff; stroke: #6c7b25; stroke-width: 2; }

    .chart-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      color: var(--ink-3);
      font-size: 10px;
      line-height: 1.4;
    }

    .chart-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.5;
    }

    .chart-caption strong { font-size: 13px; }
    .chart-caption span { color: #566815; font-weight: 700; }

    .energy-scale {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      margin-top: 12px;
    }

    .energy-step {
      height: 8px;
      border-radius: 999px;
      background: var(--hair);
    }

    .energy-step.active { background: var(--coral); }

    .energy-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: var(--ink-3);
      font-size: 10px;
      line-height: 1.4;
    }

    .metric-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding: 12px;
      border-radius: 16px;
      background: var(--hair-2);
    }

    .metric-row strong {
      font-size: 28px;
      line-height: 1;
      letter-spacing: -1px;
    }

    .metric-row strong small {
      margin-left: 4px;
      font-size: 12px;
      letter-spacing: 0;
    }

    .metric-row span {
      max-width: 140px;
      color: var(--ink-3);
      text-align: right;
      font-size: 11px;
      line-height: 1.45;
    }

    .criteria-list {
      display: grid;
      gap: 0;
      margin-top: 0;
    }

    .criteria-row {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--hair);
    }

    .criteria-row:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .criteria-icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      color: var(--ink-2);
      background: var(--hair-2);
    }

    .criteria-icon .icon { width: 16px; height: 16px; }
    .criteria-row strong { display: block; font-size: 14px; line-height: 1.45; }
    .criteria-row p { margin: 4px 0 0; color: var(--ink-3); font-size: 12px; line-height: 1.55; }

    .criteria-note {
      margin: 4px 0 0;
      color: var(--ink-3);
      font-size: 12px;
      line-height: 1.55;
    }

    .agent-card {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 32px;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin: var(--component-gap) 0 0;
      border: 0;
      color: #fff;
      background: linear-gradient(145deg, #20231f, #111516 72%);
      text-align: left;
      cursor: pointer;
    }

    .agent-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: var(--ink);
      background: var(--lime);
    }

    .agent-mark .icon { width: 20px; height: 20px; }
    .agent-copy strong { display: block; font-size: 14px; line-height: 1.45; }
    .agent-copy span { display: block; margin-top: 4px; color: #c8ccc6; font-size: 12px; line-height: 1.5; }
    .agent-card > .icon { justify-self: end; color: var(--lime); }

    .icon {
      width: 18px;
      height: 18px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.9;
    }

    .icon-small { width: 13px; height: 13px; }

    .cycle-row {
      display: flex;
      align-items: center;
      width: 100%;
      padding: var(--space-lg);
      gap: var(--space-md);
      border: 1px solid var(--hair);
      border-radius: 18px;
      color: var(--ink);
      background: rgba(255,255,255,.82);
      text-align: left;
      cursor: pointer;
    }

    .cycle-icon {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 12px;
      background: rgba(220,245,90,.52);
    }

    .cycle-copy { min-width: 0; flex: 1; }
    .cycle-title { display: block; font-size: 15px; line-height: 1.4; font-weight: 680; }
    .cycle-sub { display: flex; flex-wrap: wrap; gap: 0 8px; margin-top: 4px; color: var(--ink-3); font-size: 12px; line-height: 1.5; }
    .cycle-sub span { white-space: nowrap; }

    .deck-wrap { margin-top: var(--component-gap); }

    .deck-stage {
      position: relative;
      min-height: 0;
      transition: height .28s ease;
      --next-x: 8px;
      --next-y: 10px;
      --next-cover-opacity: 1;
      --next-content-opacity: 0;
    }

    .rec-card {
      position: absolute;
      inset: 0 0 auto;
      width: 100%;
      min-height: 0;
      padding: var(--space-lg);
      border: 0;
      border-radius: var(--card-radius);
      color: #fff;
      background: var(--plan-card-gradient);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.1),
        0 12px 24px rgba(16,16,17,.08);
      text-align: left;
      transform-origin: 50% 100%;
      transition: transform .28s cubic-bezier(.2,.78,.26,1), opacity .22s ease;
      user-select: none;
    }

    .rec-card.is-top {
      cursor: grab;
      touch-action: pan-y;
    }

    .rec-card.is-top:active { cursor: grabbing; }

    .rec-card.depth-1 {
      transform: translate(var(--next-x), var(--next-y));
      background: var(--plan-card-gradient);
      box-shadow: 0 12px 24px rgba(16,16,17,.08);
      overflow: hidden;
    }

    .rec-card.depth-1::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 6;
      border-radius: inherit;
      background: #343535;
      opacity: var(--next-cover-opacity);
      transition: opacity .22s ease;
      pointer-events: none;
    }

    .rec-card:not(.is-top) > * { visibility: hidden; }
    .rec-card.depth-2 {
      visibility: hidden;
      opacity: 0;
      transform: translate(12px, 16px);
    }

    .deck-stage.is-committing .rec-card.depth-2 {
      visibility: visible;
      opacity: 1;
      transform: translate(8px, 10px);
      background: #343535;
      box-shadow: none;
    }

    .rec-card.depth-1 > :not(.swipe-cue) {
      opacity: 0;
      transition: opacity .18s ease;
    }

    .deck-stage.is-swiping .rec-card.depth-1,
    .deck-stage.is-swiping .rec-card.depth-1::after,
    .deck-stage.is-swiping .rec-card.depth-1 > :not(.swipe-cue) {
      transition: none;
    }

    .deck-stage.is-swiping .rec-card.depth-1 > :not(.swipe-cue),
    .deck-stage.is-settling .rec-card.depth-1 > :not(.swipe-cue),
    .deck-stage.is-committing .rec-card.depth-1 > :not(.swipe-cue) {
      visibility: visible;
      opacity: var(--next-content-opacity);
    }

    .rec-card.dragging { transition: none; }
    .rec-card.fly-right { transform: translateX(520px) rotate(17deg) !important; opacity: 0; }
    .rec-card.fly-left { transform: translateX(-520px) rotate(-17deg) !important; opacity: 0; }
    .rec-card.hint { animation: swipe-hint .72s cubic-bezier(.2,.8,.25,1); }

    @keyframes swipe-hint {
      0%,100% { transform: translateX(0) rotate(0); }
      28% { transform: translateX(25px) rotate(1.8deg); }
      62% { transform: translateX(-20px) rotate(-1.4deg); }
    }

    .rec-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .direction-chip {
      padding: 4px 8px;
      color: var(--ink);
      background: var(--violet);
      font-size: 12px;
      line-height: 1.5;
      letter-spacing: 0;
    }

    .rec-title {
      margin: var(--space-md) 0;
      max-width: 560px;
      font-size: 18px;
      line-height: 1.4;
      letter-spacing: 0;
      text-wrap: pretty;
      font-weight: 670;
    }

    .rec-evidence {
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr);
      align-items: start;
      gap: 8px;
    }

    .rec-evidence > .icon {
      width: 14px;
      height: 14px;
      margin-top: 3px;
      color: var(--lime);
    }

    .rec-condition {

    .text-button {

      border-radius: 999px;
      color: var(--ink);

    .todo-list { display: grid; gap: var(--space-md); }

    .todo-delete-button {

    .todo-delete-button[hidden] { display: none; }

    .todo-row {

    .todo-row:not(.done) { cursor: grab; }

    .data-copy {

    /* Keep scrolled text from peeking through below the floating navigation. */
    .app-shell::after {
      position: fixed;
      z-index: 99;
      right: 0;
      bottom: 0;
      left: 0;

      position: fixed;

      grid-template-columns: 1fr 84px 1fr;
      align-items: center;
      width: min(688px, calc(100vw - 32px));
      height: 66px;
      padding: 0 6px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--shell-radius);
      color: #fff;
      background:
        radial-gradient(100% 150% at -10% 115%, rgba(168,191,74,.25), transparent 65%),
        linear-gradient(145deg, #20231f, #111516 70%);
      box-shadow: 0 14px 28px rgba(0,0,0,.24);
      transform: translateX(-50%);
    }

    .tab-button {
      display: grid;
      place-items: center;
      align-content: center;
      gap: 4px;
      height: 54px;
      padding: 0;
      border: 0;

      cursor: pointer;

    .tab-button.active { color: #fff; font-weight: 680; }

    .aira-button {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      margin: 0 auto;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(255,255,255,.14);
      cursor: pointer;
    }

    .aira-button .icon { width: 23px; height: 23px; }

    .toast {
      position: fixed;
      z-index: 200;
      left: 50%;
      bottom: calc(83px + var(--safe-bottom));
      max-width: min(660px, calc(100vw - 52px));
      padding: 10px 14px;
      border-radius: 999px;
      color: #fff;
      background: rgba(16,16,17,.9);
      box-shadow: 0 8px 22px rgba(0,0,0,.18);

      transform: translate(-50%, 10px);
      transition: opacity .2s ease, transform .2s ease;
      pointer-events: none;
      font-size: 13px;
      line-height: 1.5;
      width: max-content;
      text-align: center;

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    :focus-visible {
      outline: 3px solid rgba(122,203,255,.85);

    }

    @media (max-width: 374px) {

      .rec-title { font-size: 18px; }
    }

    @media (min-width: 768px) {
      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 20px;
        overflow: hidden;
        background: #d8d8d5;
      }

      .app-shell {
        width: 393px;
        height: 852px;
        zoom: min(1, calc((100dvh - 40px) / 852px));
        aspect-ratio: 393 / 852;
        min-height: 0;
        overflow: hidden;
        border: 8px solid #151516;
        border-radius: 52px;
        box-shadow:

        height: 100%;

      }

      .page::-webkit-scrollbar { display: none; }

      .app-shell::after { position: absolute; }

      .tab-bar {
        position: absolute;
        bottom: 12px;
        width: calc(100% - 32px);
      }

      .toast {
        position: absolute;
        bottom: 96px;
        max-width: calc(100% - 52px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }

    /* ===== Aira 精修层：沿用 aira-lite 的雾面卡、外框、导航与细节规格，只改视觉，不改结构与交互 ===== */
    :root {
      --on-dark-2: rgba(255,255,255,.62);
      --on-dark-3: rgba(255,255,255,.38);
      --hair-dark: rgba(255,255,255,.12);
      --lite: #f6f6f4;
      --fog-warm:
        radial-gradient(90% 85% at -2% 104%, rgba(168,191,74,.92) 0%, rgba(168,191,74,.30) 42%, transparent 70%),
        radial-gradient(70% 70% at 46% 116%, rgba(168,191,74,.46) 0%, transparent 65%),
        radial-gradient(66% 66% at 90% -4%, rgba(58,58,51,.9) 0%, transparent 70%);
      --fog-cool:
        radial-gradient(90% 85% at -2% 104%, rgba(94,137,168,.82) 0%, rgba(94,137,168,.28) 42%, transparent 70%),
        radial-gradient(70% 70% at 50% 116%, rgba(111,95,148,.52) 0%, transparent 65%),
        radial-gradient(64% 64% at 90% -4%, rgba(58,58,51,.86) 0%, transparent 70%);
      --fog-flat:
        radial-gradient(88% 86% at 22% 106%, rgba(58,58,51,.95) 0%, transparent 72%),
        radial-gradient(68% 68% at 0% 114%, rgba(168,191,74,.30) 0%, transparent 62%),
        radial-gradient(60% 60% at 90% -4%, rgba(58,58,51,.7) 0%, transparent 70%);
      --ease-out: cubic-bezier(.3,.9,.3,1);
    }

    body { text-rendering: optimizeLegibility; }

    /* 视图切换：与 Aira 一致的轻微上浮进入 */
    .page:not([hidden]) { animation: view-in .42s var(--ease-out); }
    @keyframes view-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    /* 按压反馈 */
    button { transition: transform .12s ease; }
    button:active { transform: scale(.97); }
    .goal-card:active, .agent-card:active { transform: scale(.985); }

    /* 页头 */
    .eyebrow { font-size: 12.5px; letter-spacing: .1px; }
    h1 { font-weight: 620; letter-spacing: -.7px; }
    .avatar {
      border: 2px solid #fff;
      box-shadow: 0 3px 8px rgba(0,0,0,.2);
      font-size: 14px;
      letter-spacing: .2px;
    }

    /* 分组标签：Aira kicker 的小号字距规格 */
    .section-label,
    .unified-plan .section-label {
      color: var(--ink-3);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 1.2px;
    }
    .section-meta,
    .unified-plan .section-meta {
      color: var(--ink-3);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .2px;

.ended-link { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; margin-top: var(--component-gap); padding: 12px 10px 12px 14px; border: 1.5px dashed #d0d0cc; border-radius: 20px; color: var(--ink); background: transparent; text-align: left; cursor: pointer; }
.ended-link .chev { color: var(--ink-3); }

/* ---------- 回顾页 ---------- */
.review-hero { padding: 18px 16px; }
.hero-k { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--on-dark-2); font-size: 11.5px; letter-spacing: .4px; font-variant-numeric: tabular-nums; }
.review-hero h2 { margin: 6px 0 0; font-size: 24px; line-height: 1.25; font-weight: 620; letter-spacing: -.4px; }
.review-hero p:last-child { margin: 8px 0 0; color: var(--on-dark-2); font-size: 13px; line-height: 1.6; }
.r-section { margin-top: var(--component-gap); padding: 16px; }
.r-k { margin: 0; color: var(--ink-3); font-size: 11px; font-weight: 650; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
.r-section h3 { margin: 2px 0 0; font-size: 16px; font-weight: 650; letter-spacing: -.2px; }
.r-section .sub { margin: 2px 0 12px; color: var(--ink-3); font-size: 12px; line-height: 1.5; }
.r-row { display: grid; grid-template-columns: minmax(0, 1fr) 52px; column-gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--hair); }
.r-row:first-of-type { padding-top: 0; border-top: 0; }
.r-row:last-child { padding-bottom: 0; }
.r-copy h4 { margin: 0; font-size: 14.5px; font-weight: 620; }
.r-copy p { margin: 2px 0 0; color: var(--ink-2); font-size: 12px; }
.r-strip { grid-column: 1 / -1; margin-top: 10px; }
.day-strip { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; }
.day-strip i { height: 20px; border-radius: 4px; background: #f0f0ee; }
.day-strip i.on { background: var(--done); }
.strip-axis { display: flex; justify-content: space-between; margin-top: 4px; color: var(--ink-3); font-size: 10px; font-variant-numeric: tabular-nums; }
.compare { display: grid; grid-template-columns: 1fr 24px 1fr; align-items: end; padding: 12px 14px; border-radius: 14px; background: var(--lite); }
.compare + .compare { margin-top: 8px; }
.cmp-label { grid-column: 1 / -1; display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--ink-2); font-size: 12px; }
.cmp-label em { color: var(--ink-3); font-size: 11px; font-style: normal; }
.cmp-val { display: grid; color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.cmp-val small { margin-bottom: 2px; color: var(--ink-3); font-size: 10.5px; }
.cmp-val b { color: var(--ink); font-size: 22px; line-height: 1.1; font-weight: 620; letter-spacing: -.03em; }
.cmp-val.after { text-align: right; }
.cmp-val.better b { color: var(--done-ink); }
.cmp-arrow { display: grid; place-items: center; padding-bottom: 6px; color: var(--ink-3); }
.judge-card { padding: 16px; }
.judge-card .hero-k { color: var(--lime); font-weight: 650; }
.judge-card .hero-k .icon { width: 13px; height: 13px; }
.judge { margin: 8px 0 0; font-size: 14.5px; line-height: 1.65; font-weight: 500; }
.judge-note { margin: 8px 0 0; color: var(--on-dark-3); font-size: 11px; }
.suggest { padding: 12px 0; border-top: 1px solid var(--hair); }
.suggest:first-of-type { padding-top: 0; border-top: 0; }
.suggest:last-child { padding-bottom: 0; }
.suggest-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.suggest-top h4 { margin: 0; font-size: 14.5px; font-weight: 620; }
.chg-tag { padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 650; }
.chg-tag.keep { color: var(--ink-2); background: var(--hair-2); }
.chg-tag.adjust { color: var(--ink); background: var(--lime); }
.suggest .from { margin: 8px 0 0; color: var(--ink-3); font-size: 12px; text-decoration: line-through; text-decoration-color: rgba(105,105,109,.5); }
.suggest .to { margin: 4px 0 0; font-size: 13.5px; font-weight: 600; }
.suggest .why { margin: 4px 0 0; color: var(--ink-2); font-size: 12px; line-height: 1.55; }
.review-actions { display: grid; gap: 8px; margin-top: var(--component-gap); }
.review-done { margin: var(--component-gap) 0 0; padding: 12px 16px; border-radius: 14px; color: var(--ink-2); background: var(--lite); font-size: 12.5px; line-height: 1.6; }

/* ---------- 执行记录 ---------- */
.record-hero { padding: 16px; }
.record-hero .hero-k { margin-top: 12px; }
.record-hero .act-tile + h2 { margin-top: 12px; }
.record-hero h2 { margin: 4px 0 0; font-size: 22px; font-weight: 620; letter-spacing: -.3px; }
.hero-sub { margin: 2px 0 0; color: var(--on-dark-2); font-size: 12.5px; }
.hero-plans { display: grid; gap: 6px; margin-top: 14px; }
.hero-plan { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid rgba(255,255,255,.06); border-radius: 12px; background: rgba(255,255,255,.08); }
.hp-name { font-size: 12.5px; font-weight: 600; }
.hp-name small { display: block; margin-top: 1px; color: var(--on-dark-3); font-size: 11px; font-weight: 400; font-variant-numeric: tabular-nums; }
.hp-num { color: var(--on-dark-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.hp-num b { color: var(--lime); font-size: 24px; font-weight: 600; letter-spacing: -.03em; }
.viz-card { margin-top: var(--component-gap); padding: 16px; }
.viz-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.viz-head h3 { margin: 0; font-size: 15px; font-weight: 650; }
.viz-head span { color: var(--ink-3); font-size: 11px; }
.plot { display: block; width: 100%; height: auto; overflow: visible; }
.plot text { font-family: inherit; }
.plot .axis { fill: var(--ink-3); font-size: 10px; }
.plot .val { fill: var(--ink); font-size: 10px; font-weight: 650; }
.plot .goal-line { stroke: #8a9a4c; stroke-width: 1; stroke-dasharray: 3 3; }
.plot .bar.hit { fill: var(--done); }
.plot .bar.miss { fill: #d4d6d1; }
.plot .bar.today { fill: #fff; stroke: var(--done); stroke-width: 1.5; stroke-dasharray: 3 2; }
.plot .bar.none { fill: url(#none); stroke: #d6d6d3; }
.plot .bar.future { fill: var(--track); }
.plot .win { stroke-width: 3; stroke-linecap: round; }
.plot .win.warm { stroke: var(--dot-warm); }
.plot .win.cool { stroke: var(--dot-cool); }
.plot .win.violet { stroke: var(--dot-violet); }
.plot .win-t { fill: var(--ink); font-size: 10.5px; font-weight: 600; }
.plot .win-t.dim { fill: var(--ink-3); font-weight: 400; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair); color: var(--ink-2); font-size: 11px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 3px; }
.legend i.hit { background: var(--done); }
.legend i.miss { background: #d4d6d1; }
.legend i.today { background: #fff; border: 1.5px dashed var(--done); }
.legend i.none { background: repeating-linear-gradient(45deg, #d9d9d5 0 1.5px, #fff 1.5px 4px); border: 1px solid #d6d6d3; }

/* 手动行动的日历：只标“做到了”，空着就是空着 */
.night-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.night { position: relative; display: grid; justify-items: center; gap: 5px; padding: 8px 0 7px; border: 0; border-radius: 12px; color: var(--ink-3); background: var(--lite); font: inherit; }
button.night { cursor: pointer; transition: background .15s ease; }
button.night:hover { background: #ebebe8; }
button.night:active { transform: scale(.96); }
.nd { font-size: 10px; line-height: 1; font-variant-numeric: tabular-nums; }
.nm { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #dcdcd8; transition: background .2s ease, border-color .2s ease; }
.nm .icon { width: 12px; height: 12px; stroke-width: 2.6; }
.night.on .nm { border-color: transparent; color: var(--ink); background: var(--lime); }
.night.today { background: #fff; box-shadow: inset 0 0 0 1px var(--hair); }
.night.today .nd:last-child { color: var(--ink); font-weight: 650; }
.night.future .nm { border-style: dotted; }
.night.future { opacity: .5; }
.nf { position: absolute; top: 6px; right: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--late); }
.grid-note { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--hair); color: var(--ink-3); font-size: 11.5px; line-height: 1.5; }
.history-card { margin-top: var(--component-gap); padding: 16px; }
.history-card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 650; }
.history-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 11px 0; border-top: 1px solid var(--hair); font-size: 13px; font-variant-numeric: tabular-nums; }
.history-row:first-of-type { border-top: 0; }
.history-row small { display: block; margin-top: 2px; color: var(--ink-3); font-size: 11px; }
.history-row b { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; }
.history-row b .icon { width: 12px; height: 12px; stroke-width: 2.4; }
.history-row b.ok { color: var(--done-ink); }
.history-row b.muted { color: var(--ink-3); font-weight: 500; }
.empty-note { margin: 8px 0 0; color: var(--ink-3); font-size: 12.5px; }

/* ---------- 提示条 ---------- */
.toast.has-action { display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 16px; pointer-events: auto; }
.toast-undo { min-height: 44px; padding: 0 12px; border: 0; border-radius: 99px; color: var(--ink); background: var(--lime); font-size: 12px; font-weight: 650; cursor: pointer; }

.agent-context { padding: 16px; }
.agent-context h2 { margin: 4px 0 8px; font-size: 18px; }
.agent-context ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; line-height: 1.8; }
#goal-detail-view #goal-agent-button { width: 100%; margin-top: var(--component-gap); }

@keyframes appear-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

@media (max-width: 360px) {
  .plan-title { font-size: 18px; }
  .act-row { grid-template-columns: 36px minmax(0, 1fr) 48px; }
  .act-main { grid-template-columns: 36px minmax(0, 1fr) auto auto; }
  .act-tile { width: 36px; height: 36px; }
  .per-plans { padding-left: 62px; }
  .act-foot { margin-left: 62px; }
  .ring { width: 48px; height: 48px; }
  .change-grid { grid-template-columns: 1fr; }
}

/* ---------- 第四版：目标页、添加计划、附带要求 ---------- */
.row-tip { display: inline-flex; align-items: center; gap: 5px; margin: 4px 0 0; color: var(--ink-3); font-size: 11.5px; }
.row-tip::before { width: 4px; height: 4px; border-radius: 50%; background: #c9c9c6; content: ""; }
.kicker { margin: 0 0 8px; color: var(--ink-3); font-size: 11.5px; font-weight: 650; letter-spacing: 1.2px; }
.status-chip { flex: none; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 650; }
.status-chip.good { color: var(--done-ink); background: rgba(147,166,71,.16); }
.status-chip.flat { color: var(--ink-2); background: var(--hair-2); }
.status-chip.warn { color: #8a5a12; background: rgba(255,184,92,.22); }
.agent-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; margin-top: var(--component-gap); padding: 12px 10px 12px 14px; border: 1px solid var(--hair); border-radius: 20px; color: var(--ink); background: #fff; text-align: left; cursor: pointer; }
.agent-row .act-tile { background: var(--ink); color: var(--lime); }
.agent-row .chev { color: var(--ink-3); }

/* 目标页 */
.g-hero { padding: 18px 16px; }
.g-hero h2 { margin: 6px 0 0; font-size: 24px; line-height: 1.25; font-weight: 620; letter-spacing: -.4px; }
.g-hero .hero-sub { margin: 8px 0 0; font-size: 13px; line-height: 1.6; }
.g-section { margin-top: 20px; }
.judge-card { padding: 16px; }
.ev-list { display: grid; gap: var(--component-gap); margin-top: var(--component-gap); }
.ev-card { padding: 14px; }
.ev-head { display: flex; align-items: center; gap: 12px; }
.ev-head .row-copy { flex: 1; }
.ev-head h4 { font-size: 14.5px; }
.ev-head p { font-size: 11.5px; color: var(--ink-3); }
.ev-num { display: flex; align-items: baseline; gap: 4px; margin-top: 14px; font-variant-numeric: tabular-nums; }
.ev-num b { font-size: 30px; line-height: 1; font-weight: 600; letter-spacing: -.035em; }
.ev-num small { color: var(--ink-2); font-size: 12.5px; }
.ev-num span { margin-left: 6px; color: var(--ink-3); font-size: 11.5px; }
.ev-trend { display: block; width: 100%; height: 56px; margin-top: 10px; overflow: visible; }
.ev-area { fill: url(#ev-fill); }
.ev-line { fill: none; stroke: #8a9a4c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.ev-dot { fill: #fff; stroke: #8a9a4c; stroke-width: 2.5; }
.ev-scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 12px; }
.ev-scale i { height: 8px; border-radius: 99px; background: var(--track); }
.ev-scale i.on { background: var(--late); }
.ev-axis { display: flex; justify-content: space-between; margin-top: 4px; color: var(--ink-3); font-size: 10.5px; }
.ev-note { margin: 10px 0 0; color: var(--ink-2); font-size: 12.5px; line-height: 1.55; }
.crit-card { padding: 4px 14px 12px; }
.crit-row { padding: 12px 0; border-top: 1px solid var(--hair); }
.crit-row:first-child { border-top: 0; }
.crit-row b { display: block; font-size: 14px; font-weight: 620; }
.crit-row p { margin: 3px 0 0; color: var(--ink-2); font-size: 12.5px; line-height: 1.55; }
.crit-note { margin: 8px 0 0; color: var(--ink-3); font-size: 11.5px; line-height: 1.5; }
.r-link { display: flex; justify-content: flex-end; grid-column: 1 / -1; min-height: 36px; margin-top: 4px; }
.day-strip.wide i { height: 26px; }
.day-strip i.today { box-shadow: inset 0 0 0 1.5px var(--done); background: #fff; }

/* 添加计划 */
.choice-card { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; padding: 16px 12px 16px 16px; border: 0; border-radius: var(--card-radius); color: var(--ink); text-align: left; cursor: pointer; }
.choice-card + .choice-card { margin-top: var(--component-gap); }
.choice-card.fog-card { color: #fff; }
.choice-card.fog-card p { color: var(--on-dark-2); }
.choice-card.surface { border: 1px solid var(--hair); }
.choice-card h4 { font-size: 16px; }
.choice-card p { margin-top: 4px; line-height: 1.55; }
.choice-card .chev { color: inherit; opacity: .6; }
/* 添加流程的进度：aira 引导页的 onb-bar（细轨道 + 填充 + 右侧步数） */
.onb-row { display: flex; align-items: center; gap: 12px; margin: 4px 0 20px; }
.onb-bar { flex: 1; height: 3px; border-radius: 99px; background: var(--hair); overflow: hidden; }
.onb-bar i { display: block; height: 100%; border-radius: 99px; background: var(--ink); transition: width .4s var(--ease-out); }
.onb-step { color: var(--ink-3); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.add-h { margin: 0; font-size: 22px; line-height: 1.3; font-weight: 620; letter-spacing: -.4px; }
.add-sub { margin: 6px 0 0; color: var(--ink-2); font-size: 13px; line-height: 1.55; }
.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.cat { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 12px 8px 8px; border: 1.5px solid var(--hair); border-radius: 16px; color: var(--ink); background: #fff; font-size: 14px; font-weight: 600; text-align: left; cursor: pointer; }
.cat.on { border-color: var(--ink); }
.field { display: block; margin-top: 16px; }
.field span { display: block; margin-bottom: 6px; color: var(--ink-2); font-size: 12.5px; }
.field input { width: 100%; min-height: 50px; padding: 0 14px; border: 1.5px solid var(--hair); border-radius: 14px; color: var(--ink); background: #fff; font: inherit; font-size: 16px; }
.field input:focus { border-color: var(--ink); outline: 0; }
.field-note { margin: 6px 0 0; color: var(--ink-3); font-size: 11.5px; }
.sug-list { display: grid; gap: 8px; margin-top: 16px; }
.sug { display: grid; grid-template-columns: 24px minmax(0, 1fr); align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; border: 1.5px solid var(--hair); border-radius: 16px; color: var(--ink); background: #fff; text-align: left; cursor: pointer; }
.sug.on { border-color: var(--ink); }
.sug.ghost { border-style: dashed; color: var(--ink-2); }
.sug-check { display: grid; place-items: center; width: 24px; height: 24px; border: 1.5px solid #d6d6d2; border-radius: 50%; color: transparent; }
.sug.on .sug-check { border-color: var(--ink); color: var(--lime); background: var(--ink); }
.sug.ghost .sug-check { border-style: dashed; color: var(--ink-3); }
.sug-check .icon { width: 13px; height: 13px; stroke-width: 2.6; }
.sug h4 { font-size: 14.5px; }
.sug p { font-size: 11.5px; color: var(--ink-3); }
.dur-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.dur { display: grid; justify-items: center; gap: 2px; min-height: 92px; padding: 14px 4px; border: 1.5px solid var(--hair); border-radius: 18px; color: var(--ink); background: #fff; cursor: pointer; }
.dur b { font-size: 28px; line-height: 1; font-weight: 600; letter-spacing: -.03em; }
.dur span { font-size: 12px; color: var(--ink-2); }
.dur small { margin-top: 6px; color: var(--ink-3); font-size: 10.5px; }
.dur.on { border-color: var(--ink); }
.add-actions { display: grid; gap: 8px; margin-top: 24px; }
.sum-hero { padding: 16px; }
.sum-hero h2 { font-size: 22px; }
.sum-list { margin-top: var(--component-gap); padding: 4px 14px; }
.sum-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--hair); }
.sum-row:first-child { border-top: 0; }
.aira-note { margin-top: var(--component-gap); padding: 16px; }
.aira-note .hero-k { color: var(--lime); font-weight: 650; }
.aira-note .hero-k .icon { width: 13px; height: 13px; }
.an-row { margin-top: 12px; }
.an-row b { display: block; font-size: 14px; font-weight: 620; }
.an-row p { margin: 3px 0 0; color: var(--on-dark-2); font-size: 12.5px; line-height: 1.55; }

/* ---------- 第五版：去掉日期/头像/视图开关；日历一行星期 ---------- */
#plan-view .page-header { padding: 24px 0 var(--component-gap); }
.night-head { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; color: var(--ink-3); font-size: 10.5px; text-align: center; }
.night { gap: 6px; padding: 9px 0 8px; }
.night.pad { background: transparent; }

/* ---------- 第六版：无标题；A/B 版；等待态的目标入口并行 ---------- */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
#plan-view { padding-top: 20px; }
.change-wait-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; }
.change-wait-row .change-wait { flex: 1; margin: 0; }
.change-wait-row .more-link { flex: none; }

/* ---------- 第七版：顶部安全区（刘海／灵动岛） ---------- */
/* 真机：用 env() 让内容从系统状态栏下面开始。桌面外框：画一条模拟状态栏，整页下移，避免 zoom + sticky 偏移叠加。 */
.app-shell { --safe-top: env(safe-area-inset-top, 0px); }
.status-bar { position: fixed; top: 0; right: 0; left: 0; z-index: 120; height: var(--safe-top); background: var(--page); color: var(--ink); pointer-events: none; }
.status-bar > * { display: none; }
.page { padding-top: var(--safe-top); }
#plan-view { padding-top: calc(20px + var(--safe-top)); }
.detail-header { top: var(--safe-top); }
@media (min-width: 768px) {
  .app-shell { --safe-top: 59px; }
  .status-bar { position: absolute; display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 34px; }
  .status-bar > * { display: flex; }
  .sb-time { width: 54px; font-size: 17px; font-weight: 600; letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
  .island { position: absolute; top: 11px; left: 50%; width: 126px; height: 37px; border-radius: 99px; background: #000; transform: translateX(-50%); }
  .sb-right { align-items: center; gap: 6px; }
  .page { position: absolute; top: var(--safe-top); right: 0; bottom: 0; left: 0; height: auto; padding-top: 0; }
  #plan-view { padding-top: 20px; }
  .detail-header { top: 0; }
  .app-shell::after { z-index: 99; }
}

/* ---------- 第八版：目标入口贴着"状态变化"标题 ---------- */
.block-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
.head-link { position: relative; display: inline-flex; align-items: center; gap: 2px; margin-right: -2px; padding: 0 2px; border: 0; color: var(--ink-2); background: none; font-size: 12px; font-weight: 500; cursor: pointer; }
.head-link::after { position: absolute; inset: -10px -4px; content: ""; }
.head-link .icon { width: 12px; height: 12px; }
.change-wait { margin-top: 8px; }

/* ---------- 第九版：回到仓库配色；顶对齐；小装饰 ----------
   白底上的数据色统一用墨色；亮黄绿只在深色面与主按钮上出现；橙／珊瑚只表示需要注意的状态。 */
:root { --lime-tint: #e9f4c6; --amber: #ffb85c; --coral: #ff8a5b; --dot-warm: var(--lime); --late: var(--amber); }
.ring circle.on { stroke: var(--ink); }
.seg-bar i.on { background: var(--ink); }
.did.on { border-color: transparent; color: var(--lime); background: var(--ink); }
.did.on .did-mark { border-color: transparent; color: var(--ink); background: var(--lime); }
.answered.yes, .history-row b.ok, .ct-val.better, .cmp-val.better b { color: var(--ink); }
.status-chip.good { color: var(--ink); background: var(--lime-tint); }
.status-chip.warn { color: #8a4a1c; background: rgba(255,138,91,.16); }
.day-strip i.on { background: var(--ink); }
.day-strip i.today { box-shadow: inset 0 0 0 1.5px var(--ink); }
.plot .bar.hit { fill: var(--ink); }
.plot .bar.today { stroke: var(--ink); }
.plot .goal-line { stroke: var(--ink-3); }
.legend i.hit { background: var(--ink); }
.legend i.today { border-color: var(--ink); }
.ev-line, .ev-dot { stroke: var(--ink); }
.ev-scale i.on { background: var(--amber); }
.pp-name i, .plan-chip::before { background: var(--lime); box-shadow: 0 0 0 1px rgba(16,16,17,.08); }
.pp-name i.cool, .plan-chip.cool::before { background: var(--sky); }
.pp-name i.violet, .plan-chip.violet::before { background: var(--violet); }
.review-flag { box-shadow: 0 0 10px rgba(220,245,90,.45); }
.plan-head { box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
.plan-card { box-shadow: 0 1px 1px rgba(16,16,18,.04), 0 6px 14px rgba(16,16,18,.05); }
.act-item, .ev-card, .r-section.surface, .viz-card, .history-card, .crit-card, .agent-row { box-shadow: 0 1px 1px rgba(16,16,18,.03); }
.primary-btn { box-shadow: 0 8px 24px rgba(220,245,90,.35); }

/* 顶对齐：图标块、文案、圆环都从标题那一行开始 */
.act-row { align-items: start; }
.act-row .act-tile { margin-top: 2px; }
.act-row .ring { margin-top: -2px; }
.act-main { align-items: start; }
.act-main .act-tile { margin-top: 2px; }
.act-main .chev, .act-main .shared-badge { margin-top: 8px; }
.ev-head { align-items: start; }
.ev-head .status-chip { margin-top: 2px; }
/* 图表里的"达到"用黄绿填充 + 墨色描边（仓库在浅色面上用黄绿的方式），不用整块墨色 */
.plot .bar.hit { fill: var(--lime); stroke: var(--ink); stroke-width: 1.2; }
.day-strip i.on { background: var(--lime); box-shadow: inset 0 0 0 1.2px var(--ink); }
.legend i.hit { background: var(--lime); box-shadow: inset 0 0 0 1.2px var(--ink); }
[data-ready] .plan-card, [data-ready] .act-item { animation: none; }

/* ---------- 第十版：aira 卡头解剖（圆形徽章 + 副标题 + 带点胶囊）、图例在图上、参照线 ---------- */
.cardhead { display: flex; align-items: center; gap: 9px; }
.cardhead .badge { display: grid; place-items: center; flex: none; width: 30px; height: 30px; border: 1px solid var(--hair); border-radius: 50%; color: var(--ink); background: var(--hair-2); }
.cardhead .badge .icon { width: 14px; height: 14px; stroke-width: 2; }
.fog-card .cardhead .badge { border-color: rgba(255,255,255,.06); color: #fff; background: rgba(255,255,255,.12); }
.cardhead .tt { flex: 1; min-width: 0; }
.cardhead .a { font-size: 13.5px; line-height: 1.35; font-weight: 600; }
.cardhead .b { margin-top: 1px; color: var(--ink-3); font-size: 10.5px; line-height: 1.4; }
.chip { display: inline-flex; align-items: center; gap: 5px; flex: none; padding: 4px 9px; border: 1px solid var(--hair); border-radius: 99px; color: var(--ink); background: #fff; font-size: 10.5px; font-weight: 500; white-space: nowrap; }
.chip .dot { width: 5px; height: 5px; border-radius: 50%; background: #a1a1a5; }
.chip.good .dot { background: var(--lime); box-shadow: 0 0 0 1px rgba(16,16,17,.12); }
.chip.warn .dot { background: var(--coral); }
.chip.flat .dot { background: #a1a1a5; }
.fog-card .chip { border-color: rgba(255,255,255,.08); color: #fff; background: rgba(255,255,255,.13); }
.legend-row { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 12px 0 6px; color: var(--ink-3); font-size: 10.5px; }
.legend-row span { display: inline-flex; align-items: center; gap: 6px; }
.legend-row .ln { width: 16px; border-top: 2px solid var(--ink); }
.legend-row .ln.dash { border-top-style: dashed; border-top-color: #a1a1a5; border-top-width: 1.5px; }
.legend-row .sq { width: 9px; height: 9px; border-radius: 3px; }
.legend-row .sq.hit { background: var(--lime); box-shadow: inset 0 0 0 1.2px var(--ink); }
.legend-row .sq.miss { background: #d4d6d1; }
.legend-row .sq.today { background: #fff; border: 1.5px dashed var(--ink); }
.legend-row .sq.none { background: repeating-linear-gradient(45deg, #d9d9d5 0 1.5px, #fff 1.5px 4px); border: 1px solid #d6d6d3; }
.ev-card .ev-num { margin-top: 12px; }
.ev-trend { height: 70px; margin-top: 2px; }
.ev-base { stroke: #a1a1a5; stroke-width: 1.2; stroke-dasharray: 3 3; }
.ev-line { stroke-width: 2.2; }
.ev-axis.four { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; }
.ev-axis.four span:first-child { text-align: left; }
.ev-axis.four span:last-child { text-align: right; }
.viz-card .legend { display: none; }
.viz-card .ev-note { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--hair); }
.r-section .sub { margin-bottom: 14px; }

/* 梳状段步数图 */
.plot.comb { margin-top: 4px; }
.plot .cb.hit { fill: var(--ink); }
.plot .cb.miss { fill: rgba(16,16,17,.22); }
.plot .cb.today { fill: #fff; stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 2.5 2; }
.plot .cb.none { fill: #c9c9c6; }
.plot .cb.future { fill: var(--hair); }
.plot .goal-line { stroke: #b9b9b6; stroke-width: 1; stroke-dasharray: 3 3; }
.plot .val { font-size: 9.5px; }
.legend-row .cb-k { width: 6px; height: 12px; border-radius: 3px; }
.legend-row .cb-k.hit { background: var(--ink); }
.legend-row .cb-k.miss { background: rgba(16,16,17,.22); }
.legend-row .cb-k.today { background: #fff; border: 1.4px dashed var(--ink); }

/* ---------- 方块行（aira Time points 组件） ---------- */
.viz-card.fog-card { padding: 17px; color: #fff; }
.viz-card.fog-card .viz-note { margin: 12px 0 0; color: rgba(255,255,255,.85); font-size: 12.5px; line-height: 1.5; }
.legend-row.dark { color: var(--on-dark-3); margin: 12px 0 0; }
.blk-k { width: 14px; height: 9px; border-radius: 3px; background: rgba(255,255,255,.16); }
.blk-k.on { background: var(--lime); }
.blk-k.today { background: transparent; border: 1.3px dashed rgba(255,255,255,.7); }
.blk-k.none { background: rgba(255,255,255,.05); border: 1px dashed rgba(255,255,255,.25); }
.blocks { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 4px; margin-top: 12px; }
.blk i { display: block; height: 28px; border-radius: 7px; background: rgba(255,255,255,.14); }
.blk.on i { background: var(--lime); }
.blk.today i { background: transparent; border: 1.5px dashed rgba(255,255,255,.7); }
.blk.none i { background: rgba(255,255,255,.05); border: 1px dashed rgba(255,255,255,.22); }
.blk.future i { background: rgba(255,255,255,.06); }
.blk small { display: block; margin-top: 5px; color: var(--on-dark-3); font-size: 8.5px; line-height: 1; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.blk:first-child small { text-align: left; }
.blk:last-child small { text-align: right; }
.r-section .viz-card { margin-top: 12px; }
.r-link { justify-content: flex-end; }


/* ---------- 第十一版：按 docs/plan-ui-rules.md 整理 ---------- */
/* 吸顶标题不透明，不让内容从渐变里透出来 */
.detail-header { background: var(--page); }
.detail-header::after { position: absolute; right: 0; bottom: 0; left: 0; height: 1px; background: var(--hair); content: ""; }
/* 所有深色卡都是雾面卡 */
.review-cta.fog-card { padding: 16px; color: #fff; }
/* 周网格 */
.wk-head { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; color: var(--on-dark-3); font-size: 9px; letter-spacing: .5px; text-align: center; }
.wk-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 6px; }
.wk { display: block; padding: 0; border: 0; color: inherit; background: none; font: inherit; text-align: center; }
.wk i { display: block; height: 30px; border-radius: 8px; background: rgba(255,255,255,.14); transition: transform .12s ease, background .2s ease; }
.wk.on i { background: var(--lime); }
.wk.today i { background: transparent; border: 1.5px dashed rgba(255,255,255,.7); }
.wk.none i { background: rgba(255,255,255,.05); border: 1px dashed rgba(255,255,255,.22); }
.wk.future i { background: rgba(255,255,255,.06); }
.wk.pad i { visibility: hidden; }
.wk small { display: block; margin-top: 5px; color: var(--on-dark-3); font-size: 9px; line-height: 1; font-variant-numeric: tabular-nums; }
.wk.today small { color: #fff; font-weight: 600; }
button.wk { cursor: pointer; min-height:44px; }
button.wk:active { transform: none; }
button.wk:active i { transform: scale(.94); }
.blk-k.off { background: rgba(255,255,255,.14); }
.viz-card.fog-card .viz-note { padding-top: 12px; border-top: 1px solid var(--hair-dark); }

/* ---------- 第十二版：hero 卡文字左、图标右 ---------- */
.hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.hero-top > div { min-width: 0; flex: 1; }
.hero-top .act-tile { margin-top: 2px; }
.record-hero .hero-k { margin-top: 0; }
.record-hero h2 { margin-top: 4px; }
.review-hero .hero-sub { margin: 8px 0 0; color: var(--on-dark-2); font-size: 13px; line-height: 1.6; }

/* ---------- 第十三版：步数用柱状周视图（连续数值不用格子） ---------- */
.wk-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; color: var(--on-dark-2); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.wk-btn { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 1px solid rgba(255,255,255,.1); border-radius: 50%; color: #fff; background: rgba(255,255,255,.08); cursor: pointer; }
.wk-btn .icon { width: 13px; height: 13px; }
.wk-btn:disabled { opacity: .3; cursor: default; }
.steps { display: block; width: 100%; height: auto; margin-top: 8px; overflow: visible; }
.steps text { font-family: inherit; font-variant-numeric: tabular-nums; }
.steps .wd { fill: var(--on-dark-3); font-size: 10.5px; }
.steps .wd.now { fill: #fff; font-weight: 600; }
.steps .today-band { fill: rgba(255,255,255,.06); }
.steps .sep { stroke: var(--hair-dark); stroke-width: 1; }
.steps .sc { fill: none; stroke: rgba(255,255,255,.22); stroke-width: 1.5; }
.steps .sc.hit { fill: var(--lime); stroke: none; }
.steps .sc.miss { stroke: rgba(255,255,255,.3); }
.steps .sc.none { stroke-dasharray: 2.5 2.5; }
.steps .sc.today { stroke: rgba(255,255,255,.55); }
.steps .sc.future, .steps .sc.out { stroke: rgba(255,255,255,.14); }
.steps .sc-mk { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.steps .sc-x { fill: none; stroke: rgba(255,255,255,.45); stroke-width: 1.6; stroke-linecap: round; }
.steps .bar.hit { fill: var(--lime); }
.steps .bar.miss { fill: rgba(255,255,255,.28); }
.steps .bar.today { fill: rgba(220,245,90,.45); }
.steps .bv { fill: rgba(255,255,255,.7); font-size: 10px; font-weight: 600; }
.steps .bv.hit { fill: var(--lime); }
.steps .bv.none { fill: var(--on-dark-3); font-weight: 400; font-size: 9px; }
.steps .goal { stroke: rgba(255,255,255,.45); stroke-width: 1.2; stroke-dasharray: 4 3; }
.steps .goal-tag { fill: #fff; }
.steps .goal-t { fill: var(--ink); font-size: 9.5px; font-weight: 700; }


/* Feedback comparison: preserve the original shell, cards and spacing. */
.feedback-action + .feedback-action { border-top: 1px solid var(--hair); margin-top: var(--component-gap); padding-top: var(--component-gap); }
.action-open { display: grid; grid-template-columns: 40px minmax(0,1fr) 68px; align-items: start; gap: 8px; width: 100%; min-height: 52px; padding: 0; border: 0; background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
.action-open .row-copy p { margin-top: 8px; }
.action-count { display: flex; gap: 0; align-items: center; }
.action-count > .icon { width: 16px; height: 16px; flex: none; }
.action-mark { padding-left: 48px; margin-top: 4px; }
.plan-feedback-entry { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 0; border: 0; background: transparent; text-align: left; color: var(--ink); cursor: pointer; }
.plan-feedback-entry strong { display: block; font-size: 14px; font-weight: 600; }
.plan-feedback-entry span span { display: block; margin-top: 4px; color: var(--ink-2); font-size: 12px; line-height: 1.5; }
.plan-body .block { padding-top: var(--component-gap); }
.plan-body .block-head { margin-bottom: var(--component-gap); }
.plan-body .change-grid, .plan-body .change-wait { margin-top: 0; }


#record-content { display: grid; gap: var(--component-gap); }
#record-content > *, .disclosure-body > .viz-card, .disclosure-body > .history-card { margin: 0; min-width: 0; }
.feedback-section, .feedback-suggestion, .feedback-disclosure { padding: 16px; border-radius: 22px; }
.feedback-section { display: grid; gap: var(--component-gap); }
.feedback-section h3, .disclosure-body h3, .feedback-section-label h3 { margin: 0; font-size: 15px; line-height: 1.45; font-weight: 620; }
.feedback-copy { margin: 0; font-size: 13px; line-height: 1.7; color: var(--ink-2); }
.feedback-source { margin: 0; font-size: 11.5px; line-height: 1.65; color: var(--ink-3); }
.feedback-metrics { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
.feedback-metrics > div { display: grid; align-content: start; gap: 8px; padding: 12px; border-radius: 14px; background: var(--hair-2); }
.feedback-metrics span { font-size: 11px; color: var(--ink-2); }
.feedback-metrics b { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.feedback-metrics b small { font-size: 11px; font-weight: 400; }
.feedback-metrics > div > small { color: var(--ink-2); font-size: 10.5px; line-height: 1.6; }
.feedback-suggestion .hero-k { display: flex; align-items: center; gap: 8px; margin: 0; }
.feedback-suggestion .hero-k .icon { width: 16px; height: 16px; }
.feedback-suggestion > p:last-child { margin: var(--component-gap) 0 0; font-size: 13px; line-height: 1.8; color: rgba(255,255,255,.88); }
.feedback-disclosure { padding: 0 16px; overflow: hidden; }
.feedback-disclosure > summary { min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 600; list-style: none; }
.feedback-disclosure summary::-webkit-details-marker { display: none; }
.feedback-disclosure > summary .icon { transform: rotate(90deg); }
.feedback-disclosure[open] > summary .icon { transform: rotate(-90deg); }
.disclosure-body { display: grid; gap: var(--component-gap); padding: 0 0 16px; }
.disclosure-body > div > h3 { margin-bottom: var(--component-gap); }
.disclosure-body .feedback-copy + .feedback-copy { margin-top: 8px; }
.evidence-stack { display: grid; gap: var(--component-gap); }
.feedback-evidence { padding-top: var(--component-gap); border-top: 1px solid var(--hair); display: grid; gap: var(--component-gap); }
.feedback-evidence-head { display:flex; align-items:baseline; justify-content:space-between; gap:var(--component-gap); }
.feedback-evidence-head b { min-width:0; font-size:13px; font-weight:600; }
.feedback-evidence-head small { flex-shrink:0; margin-left:auto; color:var(--ink-3); font-size:12px; text-align:right; }
.feedback-evidence .legend-row, .feedback-evidence .ev-axis { margin: 0; }
/* 保留已确认的信息位置；装饰只用模糊衬线与自然消散的局部光晕。 */
.sleep-trend { margin: 0; min-width: 0; }
.trend-meta { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 12px; color: var(--ink-3); font-size: 12px; line-height: 1.5; }
.trend-plot { position: relative; height: 144px; margin: 8px 12px 0 30px; }
.trend-grid { position: absolute; inset-inline: 0; height: 0; border-top: 1px solid #e6e6e5; }
.trend-tick { position: absolute; right: calc(100% + 10px); transform: translateY(-50%); color: var(--ink-3); font-size: 12px; line-height: 1; }
.trend-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.trend-path { fill: none; stroke: #394227; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.trend-reference { stroke: #767676; stroke-width: 1.25; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }
.trend-point { fill: white; stroke: #394227; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.trend-point.latest { stroke-width: 2; }
.trend-reference-label { position: absolute; right: -4px; transform: translateY(-100%); padding: 2px 4px; background: white; font-size: 12px; line-height: 1.4; white-space: nowrap; }
.trend-reference-label { color: #69696d; margin-top: -4px; }
.trend-dates { position: relative; height: 22px; margin: 12px 12px 0 30px; color: var(--ink-3); font-size: 12px; line-height: 1.5; }
.trend-dates span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.trend-dates span:first-child { transform: none; }
.trend-dates span:last-child { transform: translateX(-100%); }

.trend-soft-line { fill: none; stroke: url(#sleep-line-tint); stroke-width: 10; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; filter: url(#sleep-line-soften); }
.trend-focus { position: absolute; width: 88px; height: 70px; transform: translate(-50%,-50%); pointer-events: none; background: radial-gradient(ellipse at center, rgba(188,210,115,.27) 0%, rgba(188,210,115,.14) 24%, rgba(188,210,115,.055) 46%, rgba(188,210,115,0) 72%); filter: blur(2px); }

.feedback-context { padding: 4px 0; }
.feedback-context > p { margin: 0 0 8px; color: var(--ink-2); font-size: 11.5px; }
.feedback-context > div { display: flex; flex-wrap: wrap; gap: 8px; }
.feedback-context button { min-height: 44px; padding: 8px 12px; border: 1px solid var(--hair); border-radius: 99px; background: var(--card); color: var(--ink-2); font-size: 12px; cursor: pointer; }
.feedback-context button[aria-pressed="true"] { background: var(--ink); color: var(--lime); }
.feedback-discuss { width: 100%; display: grid; grid-template-columns: 40px minmax(0,1fr) 18px; gap: 8px; align-items: center; padding: 16px; text-align: left; border: 1px solid var(--hair); border-radius: 22px; color: var(--ink); cursor: pointer; }
.feedback-discuss strong { display: block; font-size: 14px; font-weight: 600; }
.feedback-discuss small { display: block; margin-top: 4px; color: var(--ink-2); font-size: 12px; }
.feedback-section-label { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.feedback-section-label span { font-size: 11px; color: var(--ink-2); }
.plan-action-feedback { display: grid; gap: var(--component-gap); scroll-margin-top: 76px; outline: none; }
.plan-action-feedback:focus-visible .feedback-action-head { outline: 2px solid var(--ink); outline-offset: 6px; border-radius: 8px; }
.feedback-action-head { display: grid; grid-template-columns: 40px minmax(0,1fr) 52px; gap: 8px; align-items: start; }
.feedback-action-head p { margin: 8px 0 0; color: var(--ink-2); font-size: 12px; line-height: 1.55; }
.feedback-action-head .ring { margin: 0; }
.record-disclosure .viz-card { padding: 12px; }
.feedback-history .history-row:last-child { border-bottom: 0; }
@media (max-width: 360px) { .feedback-metrics { grid-template-columns: 1fr; } .feedback-metrics > div { grid-template-columns: 1fr auto; align-items: center; } .feedback-metrics > div > small { grid-column: 1 / -1; } }

@media (max-width: 767px) { .app-shell { overflow-x: clip; overflow-y: visible; } }
/* Action detail: execution first, target-specific feedback second. */
.execution-card { padding:16px; border-radius:22px; }
.execution-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
.execution-head h2, .goal-feedback-card h2 { margin:0; font-size:17px; line-height:1.45; font-weight:620; }
.execution-head p { margin:8px 0 4px; font-size:13px; color:rgba(255,255,255,.86); line-height:1.6; }

function observeSuggestions() {

  for (const entry of entries) {
   if(!entry.isIntersecting) continue;

   if(!p?.proposal) continue;

}

}

 const shell=$('.app-shell'), rect=shell.getBoundingClientRect(), dialog=$('#delete-dialog');

}

const proposalCopy = {
 outdoor: { text:'结合本次报告与现有安排，建议把到户外的时间固定在起床后，减少每天临时安排的负担。', next:'起床后 1 小时内到户外 10 分钟', label:'采用调整' },

};
function proposalBlock(pid, aid) {

 if (!kind || (kind==='outdoor' && aid!=='outdoor')) return '';
 const c=proposalCopy[kind];
 return `<section class="within-suggestion" data-suggestion="${pid}"><div class="suggestion-head"><h3>给你的建议</h3><span>${icon('spark','icon')}Aira</span></div><p>${c.text}</p>${kind==='outdoor'?`<dl class="proposal-diff"><div><dt>当前安排</dt><dd>${actions.outdoor.std}</dd></div><div><dt>建议安排 · 采用后从明天开始</dt><dd>${c.next}</dd></div></dl>`:''}<div class="proposal-actions"><button type="button" data-adopt="${pid}">${c.label}</button><button type="button" data-proposal-chat="${pid}">和 Aira 聊聊</button></div></section>`;

function adoptProposal(pid) {

const end = p => p.start + p.days - 1;

/* ---------- 计算 ---------- */
const isActive = k => plans[k].status === 'active';
const plansOf = id => Object.keys(plans).filter(k => isActive(k) && plans[k].ids.includes(id));
/* 某项行动属于哪些（计划, 轮次）；已进入下一轮的，从 history 里找 */
function roundsOf(id) {
  const out = [];
  Object.keys(plans).forEach(k => { const p = plans[k];
    if (p.ids.includes(id)) out.push({ pid: k, round: p.round, start: p.start, days: p.days, active: isActive(k) });
    (p.history || []).forEach(h => { if (h.ids.includes(id)) out.push({ pid: k, round: h.round, start: h.start, days: h.days, active: false }); });
  });
  return out;
}

function progress(id, pid, r) {
  const a = actions[id], p = r || plans[pid], target = a.per[pid].target, e = p.start + p.days - 1;
  const within = d => d >= p.start && d <= Math.min(e, p.pausedAt ? p.pausedAt - 1 : e);
  if (a.days) return { n: Object.keys(a.days).map(Number).filter(d => within(d) && d < TODAY && a.days[d] >= a.threshold).length, target };
  if (a.done) return { n: [...a.done].filter(within).length, target };
  return { n: Object.keys(a.sessions).map(Number).filter(within).length, target };
}

}

  return d;
}
