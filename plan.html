  const note = a.days ? `${missing.length ? `${missing.map(dateLabel).join('、')}暂无数据；` : ''}今天还在累计。` : a.tip || '';
  return `<section class="execution-card fog-card ${plans[pid].tone}" id="execution-card">
    <div class="execution-head"><div><h2>执行情况</h2><p>${a.std}</p><small>${a.source==='device'?'设备记录':'你的记录'}</small></div><div class="execution-total"><span>${a.days?'累计达标':'已记录'}</span><div><b>${n}</b><span>${a.unit}</span></div></div></div>
    ${grid}${note?`<p class="execution-note">${note}</p>`:''}
    <div class="goal-progress-list">${pids.map(k=>{const pr=progress(id,k);return `<div class="goal-progress"><div><strong>${escapeText(plans[k].name)}</strong><small>${range(plans[k])}</small></div><div class="goal-progress-number"><b>${pr.n}</b><span> / ${pr.target} ${a.unit}</span></div></div>`;}).join('')}</div>
    <details class="execution-history" data-detail-key="days-${id}"><summary>每日明细${icon()}</summary><div>${r.rows}</div></details>
  </section>`;
}
function goalFeedbackPanel(id,pid) {
  if(plans[pid].proposal==='outdoor' && id==='outdoor') return `<div class="goal-change"><h3>最近做得怎么样</h3><p class="feedback-copy">${actionObservation(id,pid)}</p></div>${proposalBlock(pid,id)}`;
  return `<div class="goal-change"><h3>最近做得怎么样</h3><p class="feedback-copy">${actionObservation(id,pid)}</p></div>
    <section class="within-suggestion"><div class="suggestion-head"><h3>给你的建议</h3><span>${icon('spark','icon')}Aira</span></div><p>${actionSuggestion(id,pid)}</p>${actions[id].pendingStd?`<p>已采用调整，${dateLabel(actions[id].adjustment.effective)}起：${actions[id].pendingStd}。此前记录仍按原安排保留。</p>`:''}</section>
    ${discussButton(pid,id)}`;
}
function goalFeedbackCard(id,pid) {
  const pids=relatedPlans(id),selected=pids.includes(selectedFeedbackGoal.get(id))?selectedFeedbackGoal.get(id):pid;
  const badge = k => `<span class="goal-badge ${plans[k].tone}"><i aria-hidden="true"></i><span>${escapeText(plans[k].name)}</span></span>`;
  return `<section class="goal-feedback-card surface"><div class="goal-feedback-head"><h2>行动反馈</h2>
    ${pids.length>1 ? `<div class="goal-feedback-tabs" role="group" aria-label="选择反馈目标">${pids.map(k=>`<button data-feedback-goal="${k}" data-action="${id}" aria-pressed="${k===selected}" aria-controls="goal-feedback-panel">${badge(k)}</button>`).join('')}</div>` : `<p class="goal-feedback-name">${badge(selected)}</p>`}</div>
    <div id="goal-feedback-panel" data-goal="${selected}">${goalFeedbackPanel(id,selected)}</div></section>`;
}
function actionFeedback(id,pid) {
  return goalFeedbackCard(id,pid)+executionCard(id,pid);
}
function switchFeedbackGoal(id,pid) {
  if(!relatedPlans(id).includes(pid)) return;
  selectedFeedbackGoal.set(id,pid);
  document.querySelectorAll('[data-feedback-goal]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.feedbackGoal===pid));
  const panel=$('#goal-feedback-panel');
  panel.dataset.goal=pid;panel.innerHTML=goalFeedbackPanel(id,pid);
}

function planFeedback(pid) {
  const p = plans[pid];
  return `<section class="record-hero fog-card ${p.tone}"><div class="hero-top"><div><p class="hero-k">第 ${p.round} 轮 · ${range(p)}</p><h2>${escapeText(p.name)}</h2><p class="hero-sub">${p.change?.text || '刚开始几天，还在积累数据。'}</p></div>${tile(CATS.find(c => c[0] === p.category)?.[2] || 'plan', '', 'glass')}</div></section>
    <section class="feedback-section surface"><h3>身体有什么变化</h3>${changeContent(pid)}</section>
    ${supportingData(pid)}
    <div class="feedback-section-label"><h3>每项行动的反馈</h3><span>记录与小建议</span></div>
    ${p.ids.map(id => { const a = actions[id], pr = progress(id, pid); return `<section class="plan-action-feedback" id="feedback-action-${id}" tabindex="-1">
      <section class="feedback-section surface"><div class="feedback-action-head">${tile(a.icon, p.tone)}<div><h3>${a.name}</h3><p>${a.std}</p>${a.tip ? `<p>${a.tip}</p>` : ''}</div>${ring(pr.n, pr.target)}</div>
      <p class="feedback-copy">${actionObservation(id, pid)}</p>${p.status !== 'review' && a.done && p.start < TODAY ? `<div>${didToggle(id)}</div>` : ''}</section>
      ${suggestionCard(id,pid)}${recordDisclosure(id,pid)}
    </section>`; }).join('')}${discussButton(pid)}`;
}
function renderFeedback(preserve = false) {
  const route = readFeedbackRoute();
  if (!route) return;
  currentFeedback = route;
  const page = $('#record-view'), savedScroll = innerWidth >= 768 ? page.scrollTop : scrollY;
  const details = preserve ? [...page.querySelectorAll('details[open]')].map(d => d.dataset.detailKey) : [];
  const { pid, aid } = route;
  $('#record-view h1').textContent = FEEDBACK_MODE === 'action' ? actions[aid || plans[pid].ids[0]].name : '最近怎么样';
  $('#record-content').innerHTML = FEEDBACK_MODE === 'action' ? actionFeedback(aid || plans[pid].ids[0],pid) : planFeedback(pid);
  if (preserve) {
    page.querySelectorAll('details').forEach(d => d.open = details.includes(d.dataset.detailKey));
    requestAnimationFrame(() => { if (innerWidth >= 768) page.scrollTop = savedScroll; else scrollTo(0,savedScroll); });
  }
}

/* ---------- 添加计划 ---------- */
const CATS = [['睡眠与恢复', 'warm', 'moon'], ['日常精力', 'violet', 'sun'], ['运动与活动', 'cool', 'dumbbell'], ['饮食与体重', 'warm', 'flame']];
const ACT_DEF = {
  '固定起床时间': { std: '每天 7:00 前起床', icon: 'sun', kind: 'manual' }, '睡前放下手机': { std: '睡前 30 分钟', icon: 'moon', kind: 'shared:phone' }, '下午不喝咖啡': { std: '14:00 后不喝', icon: 'clock', kind: 'manual' },
  '上午到户外': { std: '上午 10 分钟', icon: 'sun', kind: 'shared:outdoor' }, '日常步行': { std: '每天 8,000 步', icon: 'walk', kind: 'shared:steps' }, '午后小睡': { std: '13:00 到 15:00 之间，20 分钟', icon: 'bed', kind: 'manual' },
  '轻松运动': { std: '每周 3 次 · 每次 20 分钟', icon: 'dumbbell', kind: 'sessions' },
  '晚饭后不加餐': { std: '20:00 后不吃', icon: 'flame', kind: 'manual' }, '每天喝够水': { std: '1.5 升', icon: 'flame', kind: 'manual' }, '早餐吃蛋白质': { std: '鸡蛋、牛奶或豆制品', icon: 'flame', kind: 'manual' }
};
const SUG = { '睡眠与恢复': ['固定起床时间', '睡前放下手机', '下午不喝咖啡'], '日常精力': ['上午到户外', '日常步行', '午后小睡'], '运动与活动': ['轻松运动', '日常步行'], '饮食与体重': ['晚饭后不加餐', '每天喝够水', '早餐吃蛋白质'] };
function newDraft() { return { step: 0, cat: null, name: '', acts: [], days: 14 }; }
const stepsBar = n => `<div class="onb-row" role="progressbar" aria-valuenow="${n}" aria-valuemin="1" aria-valuemax="3" aria-label="第 ${n} 步，共 3 步"><div class="onb-bar"><i style="width:${n / 3 * 100}%"></i></div><span class="onb-step">${n} / 3</span></div>`;
function renderAdd() {
  const d = add, body = $('#add-content');
  $('#add-title').textContent = ['添加计划', '目标', '行动', '本轮', '开始前'][d.step];
  if (d.step === 0) {
    body.innerHTML = `<button class="choice-card fog-card warm" data-add-aira="1">${tile('spark', '', 'glass')}<span class="row-copy"><h4>和 Aira 一起定</h4><p>说说你想改善什么，Aira 会结合你的数据给出一份计划。确认后出现在这里。</p></span><span class="chev">${icon()}</span></button>
      <button class="choice-card surface" data-add-step="1">${tile('plan', 'warm')}<span class="row-copy"><h4>我自己定</h4><p>已经知道要做什么的话，填三步就好。</p></span><span class="chev">${icon()}</span></button>`;
    return;
  }
  if (d.step === 1) {
    body.innerHTML = `${stepsBar(1)}<h2 class="add-h">这份计划想改善什么？</h2>
      <div class="cat-grid">${CATS.map(([c, tone, ic]) => `<button class="cat ${d.cat === c ? 'on' : ''}" data-cat="${c}" aria-pressed="${d.cat === c}">${tile(ic, tone)}<span>${c}</span></button>`).join('')}</div>
      <label class="field"><span>用一句话说目标</span><input id="add-name" type="text" maxlength="12" placeholder="比如：下午不犯困" value="${escapeText(d.name)}"></label>
      <p class="field-note">这句话会是计划的标题。</p>
      <div class="add-actions"><button class="primary-btn" data-add-step="2" ${d.cat && d.name.trim() ? '' : 'disabled'}>下一步</button></div>`;
    $('#add-name').addEventListener('input', e => { d.name = e.target.value; document.querySelector('[data-add-step="2"]').disabled = !(d.cat && d.name.trim()); });
    return;
  }
  if (d.step === 2) {
    const existing = { '睡前放下手机': 'sleep', '日常步行': 'sleep', '上午到户外': 'energy' };
    body.innerHTML = `${stepsBar(2)}<h2 class="add-h">准备做什么？</h2><p class="add-sub">选 1 到 3 条。能从设备读到的会自动记录。</p>
      <div class="sug-list">${SUG[d.cat].map(n => { const on = d.acts.some(a => a.name === n), ex = existing[n], def = ACT_DEF[n];
        return `<button class="sug ${on ? 'on' : ''}" data-act="${n}" aria-pressed="${on}"><span class="sug-check">${icon('check', 'icon')}</span><span class="row-copy"><h4>${n}</h4><p>${def.std} · ${ex ? `与「${plans[ex].name}」共用记录` : def.kind === 'manual' ? '做到了点一下' : '设备自动记录'}</p></span></button>`; }).join('')}
      </div>
      <div class="add-actions"><button class="primary-btn" data-add-step="3" ${d.acts.length ? '' : 'disabled'}>下一步</button></div>`;
    return;
  }
  if (d.step === 3) {
    body.innerHTML = `${stepsBar(3)}<h2 class="add-h">先试多久？</h2><p class="add-sub">选择这次尝试的时间范围。</p>
      <div class="dur-grid">${[7, 14, 28].map(n => `<button class="dur ${d.days === n ? 'on' : ''}" data-days="${n}" aria-pressed="${d.days === n}"><b>${n}</b><span>天</span><small>${dateLabel(TODAY + n - 1)} 结束</small></button>`).join('')}</div>
      <div class="add-actions"><button class="primary-btn" data-add-step="4">下一步</button></div>`;
    return;
  }
  const tone = CATS.find(c => c[0] === d.cat)[1];
  body.innerHTML = `${stepsBar(3)}<section class="g-hero fog-card ${tone} sum-hero"><p class="hero-k">${d.cat} · ${d.days} 天 · ${dateLabel(TODAY + d.days - 1)} 结束</p><h2>${escapeText(d.name)}</h2></section>
    <div class="sum-list surface">${d.acts.map(a => `<div class="sum-row">${tile(a.icon, tone)}<span class="row-copy"><h4>${a.name}</h4><p>${a.std}</p></span></div>`).join('')}</div>
    <div class="add-actions"><button class="primary-btn" id="add-start">开始</button><button class="ghost-btn" id="add-agent">${icon('spark', 'icon')}和 Aira 聊聊再定</button></div>`;
}
function startPlan() {
  const d = add, id = 'p' + Date.now(), tone = CATS.find(c => c[0] === d.cat)[1], ids = [];
  d.acts.forEach((a, i) => {
    const target = Math.round(d.days * (a.kind === 'sessions' ? 3 / 7 : 5 / 7));
    if (a.kind.startsWith('shared:')) { const sid = a.kind.slice(7); actions[sid].per[id] = { target }; ids.push(sid); return; }
    const aid = `${id}_${i}`;
    actions[aid] = a.kind === 'sessions'
      ? { name: a.name, std: a.std, icon: a.icon, source: 'device', unit: '次', sessions: {}, per: { [id]: { target } } }
      : { name: a.name, std: a.std, icon: a.icon, source: 'manual', unit: '天', prev: '昨天', done: new Set(), late: new Set(), per: { [id]: { target } } };
    ids.push(aid);
  });
  plans[id] = { name: d.name.trim(), category: d.cat, tone, round: 1, start: TODAY, days: d.days, status: 'active', ids, origin: 'user', change: null, hero: `先试 ${d.days} 天看看。`, criteria: [['先观察', '记录这段时间的变化与感受。']] };
  opened = new Set([id]);
  add = null; location.hash = ''; setTimeout(() => toast('计划开始了'), 50);
}

/* ---------- 路由 ---------- */
function showRoute() {
  const h = location.hash.slice(1);
  document.querySelectorAll('main.page').forEach(m => m.hidden = true);
  let target = '#plan-view';
  currentFeedback = null; recWeek = 0;
  if (h.startsWith('feedback-') && readFeedbackRoute()) { renderFeedback(); target = '#record-view'; }
  else if (h === 'add') { if (!add) add = newDraft(); renderAdd(); target = '#add-view'; }
  else if (h === 'agent') { $('#agent-title').textContent = agentContext || '选择一份计划，再和 Aira 讨论'; target = '#agent-view'; }
  $(target).hidden = false;
  requestAnimationFrame(observeSuggestions);
  if (target === '#plan-view') { renderPlans(); requestAnimationFrame(() => { $(target).scrollTop = scroll; if (innerWidth < 768) scrollTo(0, scroll); }); }
  else {
    $(target).scrollTop = 0; scrollTo(0,0); $(target).querySelector('h1')?.focus({preventScroll:true});
    if (target === '#record-view' && FEEDBACK_MODE === 'plan' && currentFeedback.aid) requestAnimationFrame(() => {
      const section = document.getElementById('feedback-action-' + currentFeedback.aid);
      section.scrollIntoView({block:'start'}); section.focus({preventScroll:true});
    });
  }
}

function go(hash) {
  if (!location.hash) scroll = innerWidth >= 768 ? $('#plan-view').scrollTop : scrollY;
  history.pushState({airaInternal:true}, '', hash ? '#'+hash : location.pathname+location.search);
  showRoute();
}

function toast(s, undo) {
  const t = $('#toast');
  t.hidden = false;
  t.innerHTML = undo ? `<span>${s}</span><button class="toast-undo" data-undo="1">撤销</button>` : `<span>${s}</span>`;
  t.classList.toggle('has-action', !!undo); t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.classList.remove('show', 'has-action'); t.hidden = true; }, undo ? 4000 : 2200);
}
const rerender = () => { currentFeedback ? renderFeedback(true) : renderPlans(); requestAnimationFrame(observeSuggestions); };

function toggleDone(id, d, late) {
  lastDeleted=null;
  const a = actions[id], on = !a.done.has(d);
  lastToggle = { id, d, wasLate: a.late.has(d) };
  if (on) { a.done.add(d); if (late) a.late.add(d); } else { a.done.delete(d); a.late.delete(d); }
  rerender();
  requestAnimationFrame(() => $(`#record-view [data-mark="${id}"][data-date="${d}"]`)?.focus({preventScroll:true}));
  return on;
}

$('#delete-dialog').addEventListener('cancel', e=>{e.preventDefault();closeDeletion();});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.querySelectorAll('.plan-management[open]').forEach(el=>{el.open=false;el.querySelector('summary').focus();}); });
// Focus ring on the more button only after keyboard use; pointer clicks keep the open state as the only cue.
document.addEventListener('pointerdown', e=>{ const d=e.target.closest?.('.plan-management'); if(d) d.dataset.pointer='1'; }, true);
document.addEventListener('keydown', ()=>{ document.querySelectorAll('.plan-management[data-pointer]').forEach(d=>delete d.dataset.pointer); }, true);
document.addEventListener('click', e=>{document.querySelectorAll('.plan-management[open]').forEach(el=>{if(!el.contains(e.target)) el.open=false;});});
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.stage) switchStage(d.stage);
  else if (d.deletePlan) requestDeletion(d.deletePlan);
  else if (d.deleteCancel) closeDeletion();
  else if (d.deleteConfirm) deletePlan(d.deleteConfirm);
  else if (d.adopt) adoptProposal(d.adopt);
  else if (d.proposalChat) { agentContext = `${plans[d.proposalChat].name} · ${proposalCopy[plans[d.proposalChat].proposal].text}`; go('agent'); }
  else if (d.toggle) { opened.has(d.toggle) ? opened.delete(d.toggle) : opened.add(d.toggle); renderPlans(); $(`[data-toggle="${d.toggle}"]`)?.focus({ preventScroll: true }); }

  else if (d.did) { const on = toggleDone(d.did, TODAY - 1, false); toast(on ? '记下了' : '记录已取消', true); }
  else if (d.mark) { const day = +d.date, on = toggleDone(d.mark, day, day < TODAY - 1); toast(on ? `${dateLabel(day)} 记下了` : `${dateLabel(day)} 的记录已取消`, true); }
  else if (d.undo) {
    if (lastDeleted && lastDeleted.stage===previewStage) { plans[lastDeleted.pid]=lastDeleted.plan; const restored=Object.fromEntries([...lastDeleted.order,...Object.keys(plans).filter(id=>!lastDeleted.order.includes(id))].filter(id=>plans[id]).map(id=>[id,plans[id]])); Object.keys(plans).forEach(id=>delete plans[id]); Object.assign(plans,restored); opened.add(lastDeleted.pid); lastDeleted=null; }
    else if (lastToggle) { const { id, d: day, wasLate } = lastToggle, a = actions[id];
      if (a.done.has(day)) { a.done.delete(day); a.late.delete(day); } else { a.done.add(day); if (wasLate) a.late.add(day); } }
    $('#toast').classList.remove('show', 'has-action'); $('#toast').hidden = true; lastToggle = null; rerender();
  }
  else if (d.week) { recWeek += +d.week; renderFeedback(true); }
  else if (d.feedbackGoal) switchFeedbackGoal(d.action,d.feedbackGoal);
  else if (d.feedback) { if (d.action) selectedFeedbackGoal.set(d.action,d.feedback); go(feedbackLink(d.feedback, d.action)); }
  else if (d.discuss) { agentContext = `${plans[d.discuss].name}${d.action ? ' · ' + actions[d.action].name : ''} · 记录与感受`; go('agent'); }
  else if (b.id === 'nav-plan') go('');
  else if (b.id === 'add-plan') { add = newDraft(); go('add'); }
  else if (d.addAira) { agentContext = '新计划'; go('agent'); }
  else if (d.addStep) { add.step = +d.addStep; renderAdd(); $('#add-view').scrollTop = 0; scrollTo(0, 0); }
  else if (d.cat) { add.cat = d.cat; add.acts = []; renderAdd(); }
  else if (d.act) { const i = add.acts.findIndex(a => a.name === d.act); if (i >= 0) add.acts.splice(i, 1); else if (add.acts.length < 3) add.acts.push({ name: d.act, ...ACT_DEF[d.act] }); else toast('先选 3 条就够了'); renderAdd(); }
  else if (d.days) { add.days = +d.days; renderAdd(); }
  else if (b.id === 'add-start') startPlan();
  else if (b.id === 'add-agent') { agentContext = `新计划 · ${add.name}`; go('agent'); }
  else if (b.id === 'add-back') { if (add && add.step > 0) { add.step -= 1; renderAdd(); } else if (history.state?.airaInternal) history.back(); else go(''); }
  else if (['record-back', 'agent-back'].includes(b.id)) { if (history.state?.airaInternal) history.back(); else go(''); }
  else if (d.placeholder) toast(d.placeholder);
});

window.addEventListener('hashchange', () => { if (location.hash === '#agent') $('#agent-title').textContent = agentContext || '选择一份计划，再和 Aira 讨论'; showRoute(); });
if(new URL(location.href).searchParams.get('stage')==='after') switchStage('after');
else showRoute();

</script></body></html>
